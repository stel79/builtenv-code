<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-desc">
  <title id="title-desc">Conding 2026 — luxury backdrop</title>
  <defs>
    <linearGradient id="lux-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#070409"/>
      <stop offset="60%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0b1013"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#e8b55a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feBlend in="SourceGraphic" in2="b" />
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#lux-sky)" />

  <!-- subtle gold glow -->
  <ellipse cx="960" cy="120" rx="220" ry="80" fill="url(#gold)" opacity="0.08" filter="url(#soft)" />

  <!-- skyline silhouettes -->
  <g fill="#071015" opacity="0.95">
    <rect x="0" y="420" width="1200" height="180" />
    <rect x="40" y="340" width="120" height="260" rx="8" />
    <rect x="200" y="300" width="180" height="300" rx="6" />
    <rect x="420" y="360" width="100" height="240" rx="6" />
    <rect x="560" y="320" width="160" height="280" rx="8" />
    <rect x="760" y="360" width="120" height="240" rx="6" />
    <rect x="940" y="340" width="200" height="260" rx="8" />
  </g>

  <!-- gold window accents -->
  <g fill="url(#gold)" opacity="0.12">
    <rect x="64" y="380" width="14" height="10" rx="2" />
    <rect x="64" y="400" width="14" height="10" rx="2" />
    <rect x="228" y="340" width="18" height="12" rx="2" />
    <rect x="268" y="340" width="18" height="12" rx="2" />
    <rect x="308" y="340" width="18" height="12" rx="2" />
    <rect x="572" y="360" width="12" height="8" rx="2" />
    <rect x="988" y="380" width="16" height="10" rx="2" />
  </g>

  <!-- title -->
  <g fill="#ffefcf" font-family="Inter, Roboto, sans-serif" font-weight="700" transform="translate(48,96)">
    <text x="0" y="0" font-size="36">Conding 2026</text>
    <text x="0" y="36" font-size="16" opacity="0.9">Luxe Edition — builtenv-code</text>
  </g>
</svg>
